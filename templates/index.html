<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security ML</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .feature {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            background: #444;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            background: #eef2f5;
        }

        @media (max-width: 700px) {
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Network Security ML</h1>

    <p class="description">
        Phishing Website Detection using Machine Learning
    </p>

    <form method="POST">

        <div class="features">

            {% for feature in feature_names %}

            <div class="feature">

                <label for="{{ feature }}">
                    {{ feature }}
                </label>

                <select name="{{ feature }}" id="{{ feature }}" required>

                    <option value="1">1</option>
                    <option value="0">0</option>
                    <option value="-1">-1</option>

                </select>

            </div>

            {% endfor %}

        </div>

        <button type="submit">
            Predict
        </button>

    </form>

    {% if result %}

    <div class="result">
        Result: {{ result }}
    </div>

    {% endif %}

</div>

</body>
</html>
